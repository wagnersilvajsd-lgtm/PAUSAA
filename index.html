    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sinalizador_tema');
          if (saved !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
